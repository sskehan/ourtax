<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Our Tax</title>
<meta name="theme-color" content="#13294b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Our Tax — one-column phone app: header with sync status, scrolling content, bottom tab bar; forms open as full-screen sheets */
:root{
  --bg:#f5f7fa; --surface:#ffffff; --surface-2:#edf0f4; --seg:#e3e8ee; --line:#dfe4ea; --line-2:#c9d2dc;
  --ink:#14212b; --ink-2:#3e4b5a; --ink-3:#5b6878; --head:#13294b;
  --navy:#13294b; --navy-ink:#ffffff; --navy-2:#9fb3cf; --gold:#f2b544;
  --accent:#0b7285; --accent-ink:#ffffff; --accent-soft:#e3f2f5; --accent-strong:#085a69;
  --lyn:#7a3e8c; --lyn-soft:#f3e8f6; --ok:#1e7b4f; --ok-soft:#e4f3ea; --warn:#a35d00; --warn-soft:#fdf1dc; --bad:#b42318; --bad-soft:#fde7e5; --bar:#8a97a5;
  --f:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --r:14px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0e141b; --surface:#17202a; --surface-2:#1e2833; --seg:#25303c; --line:#2a3541; --line-2:#3a4755;
  --ink:#e6ecf2; --ink-2:#b8c3cf; --ink-3:#98a5b3; --head:#e6ecf2;
  --navy:#0b1a30; --navy-ink:#ffffff; --navy-2:#9fb3cf; --gold:#f2b544;
  --accent:#4cc3d9; --accent-ink:#04232a; --accent-soft:#123540; --accent-strong:#86d9e8;
  --lyn:#d9a3e8; --lyn-soft:#3a2442; --ok:#6fcf9a; --ok-soft:#163324; --warn:#f0b45a; --warn-soft:#3a2c14; --bad:#f08a80; --bad-soft:#3d1f1c; --bar:#5d6b78; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:720px;margin:0 auto}
.muted{color:var(--ink-3)} .small{font-size:13px} .xs{font-size:12px}
h1,h2,h3{margin:0;line-height:1.2} h2{font-size:18px;font-weight:600} h3{font-size:14px;font-weight:600;color:var(--ink-2)}

/* header */
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:var(--navy-ink);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;gap:10px;padding-block:12px}
.brand{flex:none;display:flex;align-items:center;gap:10px;white-space:nowrap}
.brand svg{width:32px;height:32px;flex:none}
.brand b{font-size:24px;font-weight:700;letter-spacing:-.02em}
.brand span{font-size:12px;color:var(--navy-2);align-self:flex-end;padding-bottom:3px}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.12);color:#ffffff;border:0;cursor:pointer;max-width:none;flex:0 1 auto;min-width:0;margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync.ok{color:#a8e6c4} .sync.warn{background:rgba(242,181,68,.18);color:#f7cf7e}
.sync svg{width:14px;height:14px;flex:none}

main{padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
.view{display:flex;flex-direction:column;gap:14px;padding-block:6px 20px}

/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:flex;height:66px;padding:0}
nav.tabs button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:500;color:var(--ink-3);cursor:pointer}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:600}

/* controls */
.seg{display:flex;background:var(--seg);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;min-height:40px;border:0;border-radius:9px;background:transparent;font-size:14px;font-weight:500;color:var(--ink-2);cursor:pointer;padding:0 8px}
.seg button.on{background:var(--surface);color:var(--accent);font-weight:600;box-shadow:0 1px 2px rgba(20,33,43,.14)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);font-size:15px;font-weight:500;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.outline{border:1.5px solid var(--accent);color:var(--accent);font-weight:600}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn.sm{min-height:36px;font-size:14px;padding:0 12px;border-radius:10px}
.btn.big{min-height:56px;font-size:17px;border-radius:14px;width:100%}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:22px;height:22px}
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.duo .btn{min-height:64px;font-size:18px;border-radius:var(--r)}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.trio .btn{min-height:60px;font-size:16px;border-radius:var(--r);padding:0 6px;gap:4px}
.trio .btn svg{width:20px;height:20px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grid3 .field input{padding:0 8px;font-size:15px}
.cal{background:var(--surface);border-radius:14px;padding:8px 10px 10px;display:flex;flex-direction:column;gap:6px}
.cal-h{display:flex;align-items:center;justify-content:space-between}
.cal-h b{font-size:15px;color:var(--head)}
.cal-h .iconbtn:disabled{opacity:.3}
.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-w{font-size:11px;font-weight:600;color:var(--ink-3);text-align:center;padding-bottom:2px}
.cal-d{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:14px;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;padding:0}
.cal-d.we{color:var(--ink-3)}
.cal-d.today{border:2px solid var(--accent)}
.cal-d.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.cal-d:disabled{background:transparent;border-color:transparent;color:var(--line-2);cursor:default}
.cal-d i{width:5px;height:5px;border-radius:50%;background:var(--head);display:block}
.cal-d.on i{background:var(--accent-ink)}
.bdg{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;flex:none}
.bdg.ok{background:var(--ok-soft);color:var(--ok)} .bdg.no{background:var(--warn-soft);color:var(--warn)}
.btn:disabled.primary{background:var(--bar);border-color:var(--bar)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-size:14px;font-weight:500;cursor:pointer;color:var(--ink)}
.chip.on{border:2px solid var(--accent);background:var(--accent-soft);color:var(--accent)}
.chip.add{border:1.5px dashed var(--line-2);background:transparent;color:var(--ink-2)}
.places{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.place{min-height:64px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;padding:6px 14px;cursor:pointer;text-align:left;color:var(--ink)}
.place b{font-size:16px;font-weight:600;line-height:1.2} .place span{font-size:13px;opacity:.85}
.place.on{border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink)}
.place.add{border:1.5px dashed var(--line-2);background:transparent;color:var(--ink-2);align-items:center;font-weight:500}

/* fields */
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.flabel{font-size:13px;font-weight:600;color:var(--ink-2)}
.field input,.field select,.field textarea{min-height:48px;border:1px solid var(--line-2);border-radius:10px;padding:0 12px;font-size:16px;background:var(--surface);color:var(--ink);width:100%}
.field textarea{padding:10px 12px;min-height:72px;resize:vertical}
.field .hint{font-size:12.5px;color:var(--ink-3)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-size:15px;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--accent);flex:none}

/* cards & lists */
.card{background:var(--surface);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.card.flat{background:var(--surface-2)}
.kpi{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.bar{height:8px;background:var(--seg);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.bar i.grey{background:var(--bar)} .bar i.over{background:var(--bad)}
.line{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.list{background:var(--surface);border-radius:14px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);min-height:56px;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer;color:var(--ink)}
.list>.li:last-child{border-bottom:0}
.li .t{flex:1;min-width:0} .li .t b{display:block;font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .li .t span{display:block;font-size:12.5px;color:var(--ink-3)}
.li .amt{font-size:15px;font-weight:600;white-space:nowrap}
.li .t span.tag{display:inline-block;font-size:11px;color:var(--ink-2)} .li .t span.tag.bad{color:var(--bad)}
.li.removed .t b,.li.removed .amt{text-decoration:line-through;color:var(--ink-3)}
.av{width:30px;height:30px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none;background:var(--accent-soft);color:var(--accent)}
.av.p1{background:var(--lyn-soft);color:var(--lyn)}
.view h1{color:var(--head)} .kpi{color:var(--head)} .card h2{color:var(--head)}
.ico{width:36px;height:36px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.ico svg{width:20px;height:20px}
.month{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--ink-2);padding:6px 2px 0}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);vertical-align:middle;margin-left:4px}
.tag.warn{background:var(--warn-soft);color:var(--warn)} .tag.bad{background:var(--bad-soft);color:var(--bad)}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--warn-soft);color:var(--ink);border-radius:12px;padding:10px 14px;font-size:14px}
.banner.info{background:var(--surface-2)} button.banner{flex-wrap:nowrap;width:100%;color:var(--ink)} button.banner b{color:var(--accent);flex:none} .banner.bad{background:var(--bad-soft)}
.note{font-size:13px;color:var(--ink-2);line-height:1.45;background:var(--surface-2);border-radius:10px;padding:10px 12px}
.sec{display:flex;justify-content:space-between;align-items:baseline;padding:0 2px}
.empty{text-align:center;color:var(--ink-3);padding:28px 12px;font-size:14px}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:14px} dl.kv dt{color:var(--ink-3)} dl.kv dd{margin:0;text-align:right}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{position:relative;width:72px;height:72px;border-radius:10px;overflow:hidden;background:var(--seg)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:2px;right:2px;width:26px;height:26px;border-radius:999px;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:15px;line-height:1;cursor:pointer}
.log{font-size:12.5px;color:var(--ink-3);display:flex;flex-direction:column;gap:2px}

/* sheet (full-screen form) */
#sheet{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
.sh-head{flex:none;display:flex;align-items:center;gap:4px;height:calc(56px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 8px 0;background:var(--surface);border-bottom:1px solid var(--line)}
.sh-head h2{flex:1;text-align:center;font-size:17px}
.iconbtn{width:44px;height:44px;border:0;background:none;display:flex;align-items:center;justify-content:center;border-radius:10px;cursor:pointer;color:var(--ink)}
.iconbtn svg{width:24px;height:24px}
.sh-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sh-body .view{padding-block:16px 24px;gap:18px}
.sh-foot{flex:none;background:var(--surface);border-top:1px solid var(--line);padding:12px max(16px,env(safe-area-inset-left,0px)) calc(14px + env(safe-area-inset-bottom,0px))}
.sh-foot .wrap{padding:0;display:flex;flex-direction:column;gap:10px}
.sum{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sum span{font-size:14px;color:var(--ink-2)} .sum b{font-size:18px}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:min(92vw,520px);box-shadow:0 6px 24px rgba(0,0,0,.25)}

/* printed report (PDF) */
#report{display:none}
@media print{
  @page{size:A4;margin:14mm 13mm}
  html,body{background:#fff!important;color:#111!important}
  body>*:not(#report){display:none!important}
  #report{display:block!important}
}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand"><svg viewBox="0 0 96 96" aria-hidden="true"><rect width="96" height="96" rx="22" fill="#ffffff" fill-opacity=".1"/><path d="M24 50 L41 66 L72 31" stroke="#ffffff" stroke-width="15" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M24 50 L41 66 L72 31" stroke="#13294b" stroke-width="2.6" fill="none" stroke-dasharray="5 6" stroke-linecap="round"/><circle cx="72" cy="31" r="6" fill="#f2b544"/></svg><b>Our Tax</b><span id="ver"></span></div>
  <button type="button" class="sync" id="sync" data-act="goBackup">Loading…</button>
</div></header>
<main id="main" class="wrap"></main>
<nav class="tabs" aria-label="Main"><div class="wrap" id="tabs"></div></nav>
<div id="sheet" hidden></div>
<div id="report"></div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<script src="app.js"></script>
</body>
</html>
